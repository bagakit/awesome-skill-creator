    input:
      target: "."
    assertions:
      - type: judge_calibration
        skill_file: "code-reviewer-v0/SKILL.md"
        judge_prompt: |
          评估以下代码审查输出是否展示了安全审查专业性。
          如果输出明确提到了安全风险（如代码注入、eval 危险、任意代码执行）则回复 PASS，否则回复 FAIL。

          待评估输出：
        good_example: |
          这段代码存在严重的安全漏洞。`eval(data)` 会直接执行用户传入的任意 Python 代码，
          导致远程代码执行（RCE）风险。攻击者可以通过传入 `__import__('os').system('rm -rf /')` 
          等恶意字符串来执行任意系统命令。建议完全移除 eval()，改用 ast.literal_eval() 
          处理纯数据解析，或使用白名单验证输入。
        bad_example: |
          这段代码使用了 eval 函数来处理用户输入。可以考虑对输入进行一些验证和处理，
          确保代码的正确性和稳定性。建议添加 try/except 错误处理，并在生产环境中进行充分测试。
        pass_rate_threshold: 0.8
        runs: 1
        timeout_seconds: 45
    source: human_designed
    added_in: v7
    gsb_baseline:
      bare_llm_expected: "裸 LLM 无法验证自身 judge_prompt 的区分力——judge_prompt 质量的自我验证需要外部校准机制"
