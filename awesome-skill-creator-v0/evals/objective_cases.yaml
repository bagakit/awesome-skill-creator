# skill-creator v3 客观层评测用例
# Only-increase：v0 + v1 + v2 全部用例保留，v3 新增用例追加
# 新增字段：target_point（优化点标注）、regression_level（P0=核心必过，P1=Nice-to-have）

cases:

  # ===== 继承自 v0（only-increase）=====

  - id: "create_valid_skill_md"
    description: "创建的 Skill 包含合法的 SKILL.md"
    expected_result: pass
    dimension: correctness
    target_point: "基础结构完整性"
    regression_level: P0
    input: "创建一个名为 hello-world 的 Skill，功能是向用户打招呼"
    context:
      - "skill-creator 已初始化"
      - "scaffold.md 可访问"
    assertions:
      - type: file_exists
        value: "hello-world-v0/SKILL.md"
      - type: contains
        value: "description:"
        target: "hello-world-v0/SKILL.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 可能生成包含 description 的 markdown，但格式和结构不稳定"
      skill_advantage: "Skill 确保 YAML frontmatter 格式、必须字段完整、符合 scaffold 规范"
    source: human_designed
    added_in: v0

  - id: "create_complete_directory"
    description: "创建的 Skill 目录结构符合 scaffold.md 定义"
    expected_result: pass
    dimension: coverage
    target_point: "基础结构完整性"
    regression_level: P0
    input: "创建一个名为 code-reviewer 的 Skill，功能是审查代码质量"
    context:
      - "skill-creator 已初始化"
      - "scaffold.md 可访问"
    assertions:
      - type: file_exists
        value: "code-reviewer-v0/SKILL.md"
      - type: file_exists
        value: "code-reviewer-v0/process.md"
      - type: file_exists
        value: "code-reviewer-v0/manifest.yaml"
      - type: file_exists
        value: "code-reviewer-v0/evals/objective_cases.yaml"
      - type: file_exists
        value: "code-reviewer-v0/evals/eval_protocol.md"
      - type: file_exists
        value: "code-reviewer-v0/evolve_history/v0/genesis.md"
      - type: file_exists
        value: "code-reviewer-v0/evals/eval_research/literature_review.json"
      - type: file_exists
        value: "code-reviewer-v0/evolve_history/v0/attempts/attempt-001/hypothesis.md"
      - type: file_exists
        value: "code-reviewer-v0/evolve_history/v0/summary.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 可能创建部分目录结构，但易遗漏 evals/、evolve_history/ 等深层目录"
      skill_advantage: "Skill 确保完整目录树匹配 scaffold.md 标准，包含所有必须文件"
    source: human_designed
    added_in: v0

  - id: "create_valid_manifest"
    description: "创建的 manifest.yaml 包含所有必须字段且格式合法"
    expected_result: pass
    dimension: correctness
    target_point: "基础结构完整性"
    regression_level: P0
    input: "创建一个名为 doc-writer 的 Skill，功能是生成技术文档"
    context:
      - "skill-creator 已初始化"
    assertions:
      - type: file_exists
        value: "doc-writer-v0/manifest.yaml"
      - type: yaml_valid
        target: "doc-writer-v0/manifest.yaml"
      - type: yaml_field_equals
        target: "doc-writer-v0/manifest.yaml"
        field: "name"
        value: "doc-writer"
      - type: yaml_field_equals
        target: "doc-writer-v0/manifest.yaml"
        field: "version"
        value: "v0"
      - type: yaml_field_equals
        target: "doc-writer-v0/manifest.yaml"
        field: "bootstrap_status"
        value: "genesis"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 可能生成 YAML 但字段命名和枚举值不符合联邦协议"
      skill_advantage: "Skill 确保 manifest 字段、枚举值、版本格式严格符合联邦规范"
    source: human_designed
    added_in: v0

  - id: "created_skill_can_self_bootstrap"
    description: "创建的 Skill 具备自举能力——包含可执行的 self-bootstrap.md"
    expected_result: pass
    dimension: coverage
    target_point: "基础结构完整性"
    regression_level: P0
    evolution_direction: >
      v1 新增 Step 3.5（进化路径设计），为每个创建的 Skill 生成 self-bootstrap.md。
    input: "创建一个名为 test-generator 的 Skill，功能是自动生成测试用例，且该 Skill 必须能自举"
    context:
      - "skill-creator 已初始化"
      - "目标 Skill 需要包含可执行的 self-bootstrap.md"
    assertions:
      - type: file_exists
        value: "test-generator-v0/self-bootstrap.md"
      - type: contains
        value: "Phase 1"
        target: "test-generator-v0/self-bootstrap.md"
      - type: contains
        value: "only-increase"
        target: "test-generator-v0/self-bootstrap.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 不会主动生成 self-bootstrap.md，即使生成也缺乏 eval 引用"
      skill_advantage: "v1+ 的 Step 3.5 确保每个 Skill 从诞生起就有可执行的进化路径"
    source: human_designed
    added_in: v0

  - id: "eval_quality_meets_threshold"
    description: "创建的评测集：file_exists 单一断言占比 ≤40%，包含领域内容断言"
    expected_result: fail
    tier: P2
    superseded_by: "eval_file_exists_ratio"
    dimension: correctness
    target_point: "基础结构完整性"
    regression_level: P1
    evolution_direction: >
      此用例断言保持 v0 原始形式（not_contains: file_exists）以维持 only-increase。
      v3 在 validate_evals.sh 实现占比自动检测，语义等价功能由 eval_file_exists_ratio
      和 eval_has_content_assertions 覆盖。断言缺陷为永久性历史债务。
      ⭐v7 归档：标记为 P2，superseded_by=eval_file_exists_ratio（更强的语义等价替代）。
    input: "创建一个名为 sql-optimizer 的 Skill，功能是优化 SQL 查询性能"
    context:
      - "skill-creator 已初始化"
      - "评测集需包含领域特定的质量断言"
    assertions:
      - type: min_count
        target: "sql-optimizer-v0/evals/objective_cases.yaml"
        element: "cases"
        value: 5
      - type: contains
        value: "executable"
        target: "sql-optimizer-v0/evals/objective_cases.yaml"
      - type: not_contains
        value: "file_exists"
        target: "sql-optimizer-v0/evals/objective_cases.yaml"
    source: human_designed
    added_in: v0

  - id: "research_informs_design"
    description: "genesis.md 包含结构化调研记录（来源 → 发现 → 对设计的影响）"
    expected_result: pass
    dimension: correctness
    target_point: "基础结构完整性"
    regression_level: P1
    input: "创建一个名为 prompt-optimizer 的 Skill，功能是优化 LLM prompt 的效果"
    context:
      - "skill-creator 已初始化"
      - "该领域有大量前沿研究（DSPy, OPRO, APE 等）"
    assertions:
      - type: contains
        value: "调研"
        target: "prompt-optimizer-v0/evolve_history/v0/genesis.md"
      - type: contains
        value: "来源"
        target: "prompt-optimizer-v0/evolve_history/v0/genesis.md"
      - type: contains
        value: "对设计的影响"
        target: "prompt-optimizer-v0/evolve_history/v0/genesis.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 的 genesis.md 中调研记录格式不统一，难以追溯来源与影响"
      skill_advantage: "v1+ 的 Step 2 强制结构化输出，genesis.md 包含可追溯的调研影响矩阵"
    source: human_designed
    added_in: v0

  - id: genesis_contains_substance
    description: "genesis.md 包含实质性内容关键词，不仅仅是结构占位符"
    expected_result: pass
    dimension: correctness
    target_point: "基础结构完整性"
    regression_level: P1
    source: human_designed
    added_in: v0
    input:
      action: create
      name: content-checker
      description: "A utility skill for content quality verification"
    context:
      whitepaper: meta_whitepaper.md
      scaffold: scaffold.md
    assertions:
      - type: file_exists
        value: "content-checker-v0/evolve_history/v0/genesis.md"
      - type: contains
        target: "content-checker-v0/evolve_history/v0/genesis.md"
        value: "假设"
      - type: contains
        target: "content-checker-v0/evolve_history/v0/genesis.md"
        value: "已知局限"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 可能生成 genesis.md 但内容可能是泛泛的占位文本"
      skill_advantage: "Skill 确保 genesis.md 包含假设、方法、已知局限等实质性分析内容"

  # ===== 继承自 v1（only-increase）=====

  - id: "created_skill_has_domain_eval"
    description: "domain 类型 Skill 的评测集包含领域功能断言（不只是文件/格式检查）"
    expected_result: pass
    dimension: correctness
    target_point: "eval 领域感知 + 三维度覆盖"
    regression_level: P0
    input: "创建一个名为 code-reviewer 的 domain 类型 Skill，功能是审查 Python 代码质量"
    context:
      - "skill-creator v1+ 已初始化"
      - "按领域感知评测设计，domain 类型必须有内容质量断言"
    assertions:
      - type: file_exists
        value: "code-reviewer-v0/evals/objective_cases.yaml"
      - type: not_contains
        value: "file_exists"
        target: "code-reviewer-v0/evals/objective_cases.yaml"
      - type: contains
        value: "correctness"
        target: "code-reviewer-v0/evals/objective_cases.yaml"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 倾向于生成 file_exists 类型断言，缺乏领域内容验证"
      skill_advantage: "v1+ 的 Step 4 对 domain 类型强制要求领域功能断言"
    source: human_designed
    added_in: v1

  - id: "research_impact_matrix_in_genesis"
    description: "genesis.md 包含结构化调研影响矩阵（来源 → 发现 → 对设计的影响）"
    expected_result: pass
    dimension: correctness
    target_point: "eval 领域感知 + 三维度覆盖"
    regression_level: P1
    input: "创建一个名为 api-designer 的 Skill，功能是设计 RESTful API"
    context:
      - "skill-creator v1+ 已初始化"
      - "Step 2 要求结构化调研输出"
    assertions:
      - type: contains
        value: "调研影响"
        target: "api-designer-v0/evolve_history/v0/genesis.md"
      - type: contains
        value: "对设计的影响"
        target: "api-designer-v0/evolve_history/v0/genesis.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 的 genesis.md 调研记录格式随意，缺乏影响追溯"
      skill_advantage: "v1+ 的 Step 2 + Step 6 强制要求调研影响矩阵进入 genesis.md"
    source: human_designed
    added_in: v1

  - id: "three_dimension_eval_coverage"
    description: "评测集所有 case 包含 dimension 字段，且覆盖三个维度各至少 1 条"
    expected_result: pass
    dimension: coverage
    target_point: "eval 领域感知 + 三维度覆盖"
    regression_level: P0
    evolution_direction: >
      v2 引入 dimension 字段规范；v3 在 validate_evals.sh 实现自动检测。
      此用例由 fail→pass，evidence 见 genesis.md §Evidence-A。
    input: "创建一个名为 data-transformer 的 Skill，功能是转换数据格式"
    context:
      - "skill-creator v3 已初始化"
      - "评测集需覆盖三个维度"
    assertions:
      - type: contains
        value: "dimension: correctness"
        target: "data-transformer-v0/evals/objective_cases.yaml"
      - type: contains
        value: "dimension: coverage"
        target: "data-transformer-v0/evals/objective_cases.yaml"
      - type: contains
        value: "dimension: consistency"
        target: "data-transformer-v0/evals/objective_cases.yaml"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 生成的 eval cases 不会主动包含 dimension 字段"
      skill_advantage: "v3 process.md Step 4 和 validate_evals.sh 共同确保三维度强制覆盖"
    source: human_designed
    added_in: v1

  # ===== 继承自 v2（only-increase）=====

  - id: "eval_has_external_source_cases"
    description: "评测集包含 ≥2 条外部来源（frontier_paper）的用例，降低自设评测比例"
    expected_result: pass
    dimension: coverage
    target_point: "外部来源 case + evidence 防作弊"
    regression_level: P0
    evolution_direction: >
      v2 要求外部来源；v3 在 Step 4 新增「外部来源 case 获取流程」并在 validate_evals.sh 检测。
      此用例由 fail→pass，evidence 见 genesis.md §Evidence-B。
    input: "创建一个名为 code-reviewer 的 Skill，要求评测集包含领域论文来源的用例"
    context:
      - "skill-creator v3 已初始化"
      - "防止奖励作弊：外部来源用例减少自我评测偏差"
    assertions:
      - type: contains
        value: "frontier_paper"
        target: "code-reviewer-v0/evals/objective_cases.yaml"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 默认生成 human_designed 用例，不会主动引用外部论文"
      skill_advantage: "v3 Step 4 强制要求从调研论文中转化 ≥2 条 frontier_paper 用例"
    source: human_designed
    added_in: v2

  - id: "self_bootstrap_includes_evidence_field"
    description: "自举时，fail→pass 的 eval 变化附带 evidence 字段（具体执行证据）"
    expected_result: pass
    dimension: consistency
    target_point: "外部来源 case + evidence 防作弊"
    regression_level: P0
    evolution_direction: >
      v2 要求 evidence 字段；v3 在本次 genesis.md 中首次完整实例化此要求。
      此用例由 fail→pass，evidence 见 genesis.md §Evidence-C。
    input: "执行 skill-creator 自举，将某条 fail case 改为 pass"
    context:
      - "skill-creator v3 自举模式"
      - "反奖励作弊：所有 fail→pass 变化需要可验证证据"
    assertions:
      - type: contains
        value: "evidence"
        target: "skill-creator-v3/evolve_history/v3/genesis.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 自举时不会主动追踪 fail→pass 的实际执行证据"
      skill_advantage: "v3 self-bootstrap.md Phase 5 强制要求每条 fail→pass 附 evidence"
    source: human_designed
    added_in: v2

  # ===== v3 新增用例：质量导向（核心）=====

  - id: "created_process_has_domain_content"
    description: "创建的领域技能的 process.md 包含领域特有词汇，不只是通用流程模板"
    expected_result: pass
    dimension: correctness
    target_point: "失败模式驱动 eval + 领域特异性"
    regression_level: P0
    input: "创建一个名为 sql-optimizer 的 domain 类型 Skill，功能是分析和优化 SQL 查询性能，产出包括执行计划分析和索引优化建议"
    context:
      - "skill-creator v3 已初始化"
      - "v3 Step 0 要求定义领域词汇表（SQL、查询、执行计划、索引等）"
    assertions:
      - type: contains
        value: "SQL"
        target: "sql-optimizer-v0/process.md"
      - type: contains
        value: "查询"
        target: "sql-optimizer-v0/process.md"
      - type: not_contains
        value: "TODO"
        target: "sql-optimizer-v0/process.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 可能生成通用的「Step 1: 分析需求，Step 2: 设计方案」，缺乏执行计划分析、慢查询识别等 SQL 特有内容"
      skill_advantage: "v3 Step 0 强制定义领域词汇表并写入 SKILL.md，Step 3 要求包含领域词汇，Step 0 的失败模式直接驱动 SQL 特有内容的产生"
    source: human_designed
    added_in: v3

  - id: "created_eval_uses_domain_assertions"
    description: "创建的技能的 eval 断言值包含领域特有词汇，而非只检查通用结构关键词"
    expected_result: pass
    dimension: correctness
    target_point: "失败模式驱动 eval + 领域特异性"
    regression_level: P0
    input: "创建一个名为 code-reviewer 的 domain 类型 Skill，功能是审查 Python 代码的质量和安全性，关注 bug 发现、安全漏洞和代码风格"
    context:
      - "skill-creator v3 已初始化"
      - "v3 Step 4 要求从失败模式出发：失败 A=未发现明显 bug，失败 B=误报正常代码为有问题"
    assertions:
      - type: contains
        value: "Python"
        target: "code-reviewer-v0/evals/objective_cases.yaml"
      - type: not_contains
        value: "{TODO}"
        target: "code-reviewer-v0/evals/objective_cases.yaml"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 生成的 eval 断言容易是 contains: 'correctness' 或纯 file_exists，缺乏 Python 代码质量领域的具体内容检验"
      skill_advantage: "v3 Step 4 的「失败模式优先」设计要求从「未发现 bug」「误报」等具体场景反推断言，确保断言值包含领域词汇"
    source: human_designed
    added_in: v3

  - id: "created_genesis_cites_specific_source"
    description: "创建的技能的 genesis.md 调研部分包含具体来源引用（论文标题/URL），而非只有「调研」关键词"
    expected_result: pass
    dimension: consistency
    target_point: "失败模式驱动 eval + 领域特异性"
    regression_level: P1
    input: "创建一个名为 prompt-optimizer 的 Skill，功能是基于 DSPy 等方法优化 LLM prompt 效果"
    context:
      - "skill-creator v3 已初始化"
      - "v3 Step 2 要求调研引用具体来源：DSPy、APE、OPRO 等均有明确论文可引用"
    assertions:
      - type: contains
        value: "DSPy"
        target: "prompt-optimizer-v0/evolve_history/v0/genesis.md"
      - type: contains
        value: "对设计的影响"
        target: "prompt-optimizer-v0/evolve_history/v0/genesis.md"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 的 genesis.md 调研部分可能只写「参考了相关研究」，无具体来源，无法追溯验证"
      skill_advantage: "v3 Step 2 强制每条调研发现包含具体来源（标题/URL/会议），v3 evals 用 specific term 检测可追溯性"
    source: human_designed
    added_in: v3

  - id: "eval_file_exists_ratio"
    description: "创建的 sql-optimizer Skill 评测集中 file_exists 单一断言占比 ≤ 40%（eval_quality_meets_threshold 历史债务的语义等价替代）"
    expected_result: pass
    dimension: correctness
    target_point: "失败模式驱动 eval + 领域特异性"
    regression_level: P0
    input: "创建一个名为 sql-optimizer 的 Skill，功能是优化 SQL 查询性能"
    context:
      - "skill-creator v3 已初始化"
      - "v3 validate_evals.sh 自动检测 file_exists 占比约束"
    assertions:
      - type: min_count
        target: "sql-optimizer-v0/evals/objective_cases.yaml"
        element: "cases"
        value: 5
      - type: contains
        value: "contains"
        target: "sql-optimizer-v0/evals/objective_cases.yaml"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 倾向于生成大量 file_exists 断言，content 断言稀少"
      skill_advantage: "v3 Step 4 失败模式驱动 + validate_evals.sh 共同强制执行 file_exists 占比约束"
    source: human_designed
    added_in: v3

  - id: "eval_has_content_assertions"
    description: "创建的 Skill 的评测集中至少有 1 条包含 contains 或 executable 的内容性断言"
    expected_result: pass
    dimension: correctness
    target_point: "失败模式驱动 eval + 领域特异性"
    regression_level: P0
    input: "创建一个名为 refactoring-guide 的 Skill，功能是指导代码重构"
    context:
      - "skill-creator v3 已初始化"
    assertions:
      - type: contains
        value: "contains"
        target: "refactoring-guide-v0/evals/objective_cases.yaml"
    gsb_baseline:
      bare_llm_expected: "裸 LLM 生成的 eval 以文件存在检查为主，缺少内容质量验证"
      skill_advantage: "v3 Step 4 的失败模式驱动设计确保内容断言覆盖"
    source: human_designed
    added_in: v3

  - id: "process_declares_step_io"
    description: "创建的 Skill 的 process.md 明确声明每步的输入和输出（基于 Khattab et al. (2023) 'DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines' 模块签名原则）"
    expected_result: pass
    dimension: coverage
