  - id: "run_script_timeout_stops_infinite_loop"
    description: "v5: timeout_seconds 字段使 run_script 在超时后返回失败，防止无限循环挂住 eval"
    expected_result: pass
    dimension: correctness
    target_point: "v5: run_script 超时控制"
    regression_level: P1
    input: "验证 timeout_seconds 字段生效"
    context:
      - "run_eval.sh 的 run_script handler 需在超时后退出 124 并返回 fail"
    assertions:
      - type: run_script
        target: "skill-creator-v5"
        script: |
          # 调用 run_eval.sh 并传入一个包含 sleep 的脚本，期望 timeout 生效
          # 直接检查 timeout 命令可用性（macOS 可能需要 gtimeout）
          if command -v timeout >/dev/null 2>&1; then
            timeout 2 bash -c 'sleep 10' 2>&1
            code=$?
            [ "$code" = "124" ] || { echo "timeout exit code was $code, expected 124"; exit 1; }
            echo "PASS: timeout returned 124"
          else
            echo "SKIP: timeout not available, checking gtimeout"
            if command -v gtimeout >/dev/null 2>&1; then
              echo "PASS: gtimeout available"
            else
              echo "SKIP: no timeout command available"
            fi
          fi
        expected_exit: 0
    source: human_designed
    added_in: v5
    gsb_baseline:
      bare_llm_expected: "裸 LLM 不会处理 eval 超时控制问题"
      skill_advantage: "v5 run_script sandbox/timeout 是 skill-creator 自举中新增的基础设施能力"

