  # ============================================================
  # v0 补丁：article arxiv 质量语义验证
  # ============================================================

  - id: "article_arxiv_judge_calibration"
    description: "judge_calibration 验证 judge_prompt 能区分 arxiv 可发表质量 abstract（有具体声明+量化结果）与空洞描述（无数据支撑）"
    expected_result: pass
    dimension: correctness
    target_point: "v0 补丁：article 质量语义验证——arxiv 可发表性"
    tier: P1
    regression_level: P1
    input:
      target: "."
    assertions:
      - type: judge_calibration
        judge_prompt: |
          你是一名 AI/ML 学术论文的审稿人。评估以下 abstract 是否达到 arxiv 可发表标准。
          判断依据（NeurIPS Reproducibility Checklist）：
          1. 声明具体且可证伪——有具体数字、系统名称、机制名称，不是"我们提出了一个有效框架"
          2. 核心贡献可从 abstract 独立判断——不需要读全文就能理解"解决了什么问题、用什么机制、效果如何"
          3. 没有无支撑的全称断言——"所有情况下都更好"等表述如无条件限制则为 FAIL
          如果满足以上三点，回复 PASS，否则回复 FAIL。

          待评估 abstract：
        good_example: |
          We present awesome-skill-creator, a framework for creating verifiable,
          continuously-improving domain skills for LLM-based autonomous agents under
          a zero-shot constraint. The core risk is self-referential evaluation: when
          artifact, evaluator, and creator are all LLM-mediated, apparent improvements
          can be faked by weakening criteria. We operationalize quality with five
          mechanisms: goal-first .step0.yaml (domain vocab enforcement), failure-mode-first
          eval (append-only cases with evolution_direction), run_script assertions on
          real fixtures, invoke_skill_judge semantic evaluation, and judge_calibration
          as meta-oracle requiring known-good samples to pass AND known-bad samples to fail.
          Structural validation via validate.sh --ship runs 821+ checks. GSB comparison
          against bare LLM shows G=6/S=2/B=1 across 9 dimensions. Terminal validation
          (delivering knowledge-crystallizer, ≥14/20 human rating) is chartered but
          not yet executed, representing the only evaluation that breaks self-referential closure.
        bad_example: |
          We present a new framework for creating high-quality domain skills for AI agents.
          Our approach addresses the key challenges in skill engineering through a comprehensive
          methodology that ensures quality and reliability. The framework has been designed
          with best practices in mind and incorporates various validation mechanisms.
          Experiments demonstrate that our approach is effective and produces better results
          than baseline methods. The system is flexible and can be applied to various domains.
        pass_rate_threshold: 0.8
        runs: 1
        timeout_seconds: 60
    source: human_designed
    added_in: v0
    gsb_baseline:
      bare_llm_expected: "裸 LLM 无法区分形式合格与内容实质——两个 abstract 都会被接受，因为它们结构相同"
      skill_advantage: "judge_calibration 校准后的 judge 能区分'有具体机制名+量化数据'与'只有通用描述'，防止 article eval 被空洞内容通过"

  - id: "article_arxiv_invoke_skill_judge"
    description: "invoke_skill_judge 验证 awesome-skill-creator 自身 article 的三项 arxiv 质量维度：声明有支撑、related work 有差异定位、limitations 有量化"
    expected_result: pass
    dimension: coverage
    target_point: "v0 补丁：article 质量语义验证——arxiv 可发表性"
    tier: P1
    regression_level: P1
    input:
      target: "awesome-skill-creator-v0"
      skill_input: "评估 evolve_history/v0/article/ 下的文章"
    assertions:
      - type: invoke_skill_judge
        judge_prompt: |
          你是一名 AI/ML 会议审稿人（NeurIPS/ICML 水平）。
          评估提供的论文片段是否满足以下三项 arxiv 发表标准：

          **标准 A — 贡献有支撑**：Section 1.3 的每条 contribution 必须在正文某处有对应的具体数据（如通过率、case 数量、量化对比）或引用文献编号支撑，不能只是主张。

          **标准 B — Related Work 有差异定位**：Section 2 中每篇引用文献不只是"X 做了 Y"，还需解释"本工作与之的具体差异或继承关系"。

          **标准 C — Limitations 有量化**：Limitations 节的每项局限必须包含量化描述（百分比/case 数/具体场景），不接受纯定性描述如"未来工作将解决"。

          如果三项均满足，回复 PASS: [简要理由]；如有任意一项不满足，回复 FAIL: [具体哪项不满足及原因]。
        pass_rate_threshold: 0.8
        timeout_seconds: 90
    source: human_designed
    added_in: v0
    gsb_baseline:
      bare_llm_expected: "裸 LLM 创建的 article 通常声明笼统（无引用编号支撑）、related work 只列举不比较、limitations 只定性描述"
      skill_advantage: "process.md 强制 Related Work ≥10 篇 + Discussion 必须含量化失败分析；judge 三维检查比结构检查更能发现实质性不足"

