  # ===== v4 新增：executable assertions (run_script 类型) =====

  - id: "step0_yaml_required_fail"
    description: "v4 强制要求 .step0.yaml 存在（v3 只是 warn，v4 升级为 fail）——validate_structure.sh 应对缺失的 .step0.yaml 报错"
    expected_result: pass
    dimension: correctness
    target_point: "Step 0 强制化"
    regression_level: P1
    evolution_direction: >
      v4 将 .step0.yaml 从可选升级为强制，确保每个创建的 Skill 都有可追溯的目标定义。
      下一优化点：validate_evals.sh 检测 eval case 中的 failure_modes 是否与 .step0.yaml 对齐。
    input: "在 skill-creator-v4 上运行 validate_structure.sh，检查 .step0.yaml 缺失时是否报 FAIL"
    context:
      - "skill-creator-v4 validate_structure.sh 已更新，将缺失 .step0.yaml 从 warn 升级为 fail"
    assertions:
      - type: run_script
        target: "skill-creator-v4"
        script: |
          # 创建临时测试目录（无 .step0.yaml），确认 validate_structure.sh 报 FAIL
          tmpdir=$(mktemp -d /tmp/test_skill_XXXX)
          trap "rm -rf $tmpdir" EXIT
          # 创建最小结构
          mkdir -p "$tmpdir/evals" "$tmpdir/locks" "$tmpdir/evolve_history/v0/attempts/attempt-001"
          touch "$tmpdir/SKILL.md" "$tmpdir/process.md" "$tmpdir/manifest.yaml"
          touch "$tmpdir/evals/objective_cases.yaml" "$tmpdir/evals/eval_protocol.md"
          touch "$tmpdir/locks/evolve.lock" "$tmpdir/locks/promote.lock" "$tmpdir/locks/register.lock"
          echo "cases: []" > "$tmpdir/evals/objective_cases.yaml"
          mkdir -p "$tmpdir/evolve_history/v0"
          echo "" > "$tmpdir/evolve_history/v0/genesis.md"
          # Rename dir to match pattern
          mv "$tmpdir" "/tmp/test-skill-v0-$$"
          tmpdir="/tmp/test-skill-v0-$$"
          trap "rm -rf $tmpdir" EXIT
          # Run validate_structure.sh — expect it to contain FAIL for .step0.yaml
          output=$(bash tools/validate_structure.sh "$tmpdir" 2>&1)
          echo "$output" | grep -q "step0.yaml missing" && echo "CONFIRMED: step0 missing is FAIL" && exit 0
          echo "ERROR: expected step0.yaml FAIL not found in output"
          echo "$output"
          exit 1
        expected_exit: 0
        expected_stdout_contains: "CONFIRMED: step0 missing is FAIL"
    source: human_designed
    added_in: v4
    gsb_baseline:
      bare_llm_expected: "裸 LLM 无法执行 shell 脚本验证工具行为，只能静态描述预期行为"
      skill_advantage: "v4 run_script 断言实际执行 validate_structure.sh 并验证输出，是功能验证而非结构检查"

  - id: "run_script_verifies_json_validity"
    description: "run_script 断言能验证 eval_research JSON 文件语法合法（不只是文件存在）"
    expected_result: pass
    dimension: correctness
    target_point: "executable assertion 功能验证"
    regression_level: P1
    evolution_direction: >
      run_script 是 v4 最核心的新能力。此 case 证明它能验证「文件内容语义正确」，
      而非只是「文件存在」。下一步：用 run_script 验证 process.md 步骤数量和领域词汇密度。
    input: "验证 kubernetes-debug-advisor-v0 的 eval_research JSON 是语法合法的 JSON"
    context:
      - "kubernetes-debug-advisor-v0 是 v3 终极检验创建的 fixture，eval_research/ 下有 5 个 JSON"
    assertions:
      - type: run_script
        target: "kubernetes-debug-advisor-v0"
        script: |
          # Verify all eval_research JSONs are valid JSON (not just that they exist)
          fail=0
          for f in evals/eval_research/*.json; do
            if python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "✓ valid JSON: $f"
            else
              echo "✗ invalid JSON: $f"
              fail=1
            fi
          done
          count=$(ls evals/eval_research/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "Total JSON files validated: $count"
          [ "$count" -ge 5 ] || { echo "ERROR: expected ≥5 JSON files, got $count"; exit 1; }
          [ "$fail" -eq 0 ] || exit 1
        expected_exit: 0
        expected_stdout_contains: "Total JSON files validated: 5"
    source: human_designed
    added_in: v4
    gsb_baseline:
      bare_llm_expected: "裸 LLM 无法执行 JSON 解析验证；只能说'JSON 应该合法'"
      skill_advantage: "v4 run_script 实际解析每个 JSON 文件，错误格式在 eval 时即被发现，而非在运行时报错"

